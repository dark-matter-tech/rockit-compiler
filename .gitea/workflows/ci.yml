name: CI

on:
  push:
  pull_request:
    branches: [develop, beta, master, staging]

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    container: swift:5.10.1-jammy
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends git libssl-dev pkg-config curl
          if command -v clang > /dev/null 2>&1; then
            echo "clang already available"
          else
            apt-get install -y --no-install-recommends clang-15
            ln -sf /usr/bin/clang-15 /usr/bin/clang
          fi
          apt-get clean && rm -rf /var/lib/apt/lists/*

      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --recurse-submodules --branch "${BRANCH}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ gitea.token }}

      - name: Clone Stage 0 (bootstrap compiler)
        run: |
          git clone --depth 1 "https://x-access-token:${GITEAPAT}@${GITHUB_SERVER_URL#https://}/Dark-Matter/rockit-booster.git" /tmp/stage0
        env:
          GITEAPAT: ${{ secrets.GITEAPAT }}

      - name: Build Stage 0
        run: cd /tmp/stage0 && swift build -c release

      - name: Build Stage 1
        run: |
          bash src/build.sh
          /tmp/stage0/.build/release/rockit build-native src/command.rok

      - name: Build runtime
        run: bash runtime/rockit/build.sh

      - name: Integration tests
        run: |
          STAGE1=src/command
          TRIPLE="x86_64-unknown-linux-gnu"
          PASS=0; FAIL=0; TOTAL=0
          for f in examples/test_*.rok; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .rok)
            TOTAL=$((TOTAL + 1))
            if $STAGE1 build-native "$f" -o "examples/$name" --runtime-path runtime/rockit_runtime.o --lib-path launchpad --target-triple $TRIPLE > /tmp/build_log 2>&1; then
              "examples/$name" > /dev/null 2>&1 || true
              PASS=$((PASS + 1))
            else
              echo "FAIL: $name"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Tests: $PASS/$TOTAL passed"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Bootstrap verification
        run: |
          TRIPLE="x86_64-unknown-linux-gnu"
          src/command build-native src/command.rok -o /tmp/stage2 --runtime-path runtime/rockit_runtime.o --target-triple $TRIPLE
          src/command compile src/command.rok -o /tmp/stage2.rokb
          /tmp/stage2 compile src/command.rok -o /tmp/stage3.rokb
          diff /tmp/stage2.rokb /tmp/stage3.rokb && echo "Bootstrap verified" || (echo "Bootstrap FAILED" && exit 1)

      - name: Upload toolchain package
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          mkdir -p /tmp/rockit-toolchain/bin /tmp/rockit-toolchain/share/rockit
          cp src/command /tmp/rockit-toolchain/bin/rockit
          cp runtime/rockit_runtime.o /tmp/rockit-toolchain/share/rockit/
          cp -r launchpad /tmp/rockit-toolchain/share/rockit/stdlib
          chmod +x /tmp/rockit-toolchain/bin/rockit
          cd /tmp && tar -czf rockit-toolchain-linux-x86_64.tar.gz rockit-toolchain

          API="${GITHUB_SERVER_URL}/api"
          PKG_VERSION="0.0.$(date +%Y%m%d%H%M%S)"
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            --upload-file /tmp/rockit-toolchain-linux-x86_64.tar.gz \
            "${API}/packages/Dark-Matter/generic/rockit-toolchain/${PKG_VERSION}/rockit-toolchain-linux-x86_64.tar.gz"

          # Also upload as "latest"
          curl -s -X DELETE \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/packages/Dark-Matter/generic/rockit-toolchain/latest" || true
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            --upload-file /tmp/rockit-toolchain-linux-x86_64.tar.gz \
            "${API}/packages/Dark-Matter/generic/rockit-toolchain/latest/rockit-toolchain-linux-x86_64.tar.gz"

          echo "Uploaded rockit-toolchain ${PKG_VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITEAPAT }}

  notify-integration:
    name: Trigger integration tests
    runs-on: ubuntu-22.04
    needs: [linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    steps:
      - name: Dispatch to rockit-lang
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            https://api.github.com/repos/dark-matter-tech/rockit-lang/dispatches \
            -d "{\"event_type\":\"integration-test\",\"client_payload\":{\"repo\":\"rockit-compiler\",\"ref\":\"${GITHUB_REF_NAME}\"}}"
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}

  docker:
    name: Push Docker Image
    runs-on: ubuntu-22.04
    needs: [linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --recurse-submodules --branch "${BRANCH}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ gitea.token }}

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config
          if command -v clang > /dev/null 2>&1; then
            echo "clang available"
          else
            apt-get install -y --no-install-recommends clang-15
            ln -sf /usr/bin/clang-15 /usr/bin/clang
          fi
          apt-get clean && rm -rf /var/lib/apt/lists/*

      - name: Build compiler + runtime
        run: |
          git clone --depth 1 "https://x-access-token:${GITEAPAT}@${GITHUB_SERVER_URL#https://}/Dark-Matter/rockit-booster.git" /tmp/stage0
          cd /tmp/stage0 && swift build -c release && cd -
          ROCKIT=/tmp/stage0/.build/release/rockit
          bash src/build.sh
          $ROCKIT build-native src/command.rok
          bash runtime/rockit/build.sh
          mkdir -p rockit-compiler/bin rockit-compiler/share/rockit
          cp src/command rockit-compiler/bin/rockit
          cp runtime/rockit_runtime.o rockit-compiler/share/rockit/rockit_runtime.o
          chmod +x rockit-compiler/bin/rockit
        env:
          GITEAPAT: ${{ secrets.GITEAPAT }}

      - name: Determine Docker tag
        run: |
          case "${GITHUB_REF}" in
            refs/heads/beta)    echo "DOCKER_TAG=beta" >> "$GITHUB_ENV" ;;
            refs/heads/master)  echo "DOCKER_TAG=rc" >> "$GITHUB_ENV" ;;
            refs/heads/staging) echo "DOCKER_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.toolchain \
            -t ${DOCKERHUB_USERNAME}/rockit-compiler:${DOCKER_TAG} .
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Push to Docker Hub
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker push ${DOCKERHUB_USERNAME}/rockit-compiler:${DOCKER_TAG}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  mirror:
    name: Mirror to GitHub
    runs-on: ubuntu-22.04
    needs: [linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git clone --bare "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ gitea.token }}
      - name: Push to GitHub
        run: |
          git remote add github "https://x-access-token:${GH_MIRROR_PAT}@github.com/dark-matter-tech/rockit-compiler.git"
          git push github --all --force
          git push github --tags --force
          echo "Mirrored to GitHub"
        env:
          GH_MIRROR_PAT: ${{ secrets.GH_MIRROR_PAT }}
