name: Build CI Image

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'runtime/**'
      - 'launchpad/**'
      - 'Dockerfile.ci'
      - '.gitea/workflows/docker.yml'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and push rockit-ci image
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git clone --depth 1 --recurse-submodules --branch master "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ gitea.token }}

      - name: Download toolchain package
        run: |
          API="${GITHUB_SERVER_URL}/api"
          curl -sL -H "Authorization: token ${GITEA_PAT}" \
            "${API}/packages/Dark-Matter/generic/rockit-toolchain/latest/rockit-toolchain-linux-x86_64.tar.gz" \
            -o /tmp/toolchain.tar.gz
          cd /tmp && tar -xzf toolchain.tar.gz
          cp -r /tmp/rockit-toolchain .
          chmod +x rockit-toolchain/bin/rockit
          rockit-toolchain/bin/rockit version
        env:
          GITEA_PAT: ${{ secrets.GITEAPAT }}

      - name: Log in to Gitea Container Registry
        run: |
          REGISTRY="${GITHUB_SERVER_URL#https://}"
          echo "${GITEA_PAT}" | docker login "${REGISTRY}" -u burnside --password-stdin
        env:
          GITEA_PAT: ${{ secrets.GITEAPAT }}

      - name: Build image
        run: |
          REGISTRY="${GITHUB_SERVER_URL#https://}"
          IMAGE="${REGISTRY}/dark-matter/rockit-ci"
          docker build \
            -f Dockerfile.ci \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:$(git rev-parse --short HEAD)" \
            .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:$(git rev-parse --short HEAD)"
          echo "Pushed ${IMAGE}:latest"
