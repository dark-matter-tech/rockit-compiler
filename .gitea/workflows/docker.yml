name: Build CI Image

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'runtime/**'
      - 'launchpad/**'
      - 'Dockerfile.ci'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build and push rockit-ci image
    runs-on: ubuntu-22.04
    needs: []
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git clone --depth 1 --recurse-submodules --branch master "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ gitea.token }}

      - name: Log in to Gitea Container Registry
        run: |
          echo "${GITHUB_TOKEN}" | docker login "${GITHUB_SERVER_URL#https://}" -u burnside --password-stdin
        env:
          GITHUB_TOKEN: ${{ gitea.token }}

      - name: Build image
        run: |
          REGISTRY="${GITHUB_SERVER_URL#https://}"
          IMAGE="${REGISTRY}/dark-matter/rockit-ci"
          docker build \
            -f Dockerfile.ci \
            --build-arg GITEA_PAT="${GITEA_PAT}" \
            --build-arg GITEA_HOST="${REGISTRY}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:$(git rev-parse --short HEAD)" \
            .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
        env:
          GITEA_PAT: ${{ secrets.GITEAPAT }}

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:$(git rev-parse --short HEAD)"
          echo "Pushed ${IMAGE}:latest"
