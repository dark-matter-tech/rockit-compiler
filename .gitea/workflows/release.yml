name: Release

on:
  push:
    branches: [staging]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    container: swift:5.10.1-jammy

    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git libssl-dev pkg-config curl jq gnupg
          if ! command -v clang > /dev/null 2>&1; then
            apt-get install -y clang-15
            ln -sf /usr/bin/clang-15 /usr/bin/clang
          fi

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git clone --depth 1 --recurse-submodules --branch "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ gitea.token }}

      - name: Clone and build Stage 0 (bootstrap compiler)
        run: |
          git clone --depth 1 "${GITHUB_SERVER_URL}/Dark-Matter/rockit-booster.git" /tmp/stage0
          cd /tmp/stage0 && swift build -c release

      - name: Build Stage 1
        run: |
          bash src/build.sh
          /tmp/stage0/.build/release/rockit build-native src/command.rok

      - name: Build runtime
        run: bash runtime/rockit/build.sh

      - name: Build Fuel
        run: |
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${FUEL_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git clone --depth 1 --branch develop "${GITHUB_SERVER_URL}/Dark-Matter/fuel.git" /tmp/fuel
          src/command build-native /tmp/fuel/src/fuel.rok -o /tmp/fuel/fuel --runtime-path runtime/rockit_runtime.o
        env:
          FUEL_TOKEN: ${{ secrets.FUEL_TOKEN }}

      - name: Import GPG signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d/ -f2)" >> "$GITHUB_ENV"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Package and sign
        run: |
          ARCHIVE="rockit-${VERSION}-linux-x86_64"
          STAGING="dist/${ARCHIVE}/rockit"
          mkdir -p "${STAGING}/bin" "${STAGING}/share/rockit"
          cp src/command "${STAGING}/bin/rockit"
          cp /tmp/fuel/fuel "${STAGING}/bin/fuel"
          chmod +x "${STAGING}/bin/rockit" "${STAGING}/bin/fuel"
          cp runtime/rockit_runtime.o "${STAGING}/share/rockit/"
          cp -r launchpad "${STAGING}/share/rockit/launchpad"

          # Sign binaries with GPG if key is available
          if [ -n "${GPG_KEY_ID:-}" ]; then
            bash scripts/sign.sh "${STAGING}/bin/rockit" gpg || true
            bash scripts/sign.sh "${STAGING}/bin/fuel" gpg || true
          fi

          # Generate manifest after signing
          cd "${STAGING}"
          find . -type f ! -name "MANIFEST.sha256" ! -name "*.sig" | sort | while read -r f; do
            hash=$(shasum -a 256 "$f" | awk '{print $1}')
            echo "sha256:${hash}  ${f#./}" >> MANIFEST.sha256
          done
          cd ../../..

          # Sign the manifest
          if [ -n "${GPG_KEY_ID:-}" ]; then
            export GPG_KEY_ID
            export GPG_PASSPHRASE="${GPG_PASSPHRASE:-}"
            bash scripts/sign.sh "${STAGING}/MANIFEST.sha256" manifest || true
          fi

          cd dist && tar -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create release
        run: |
          API="${GITHUB_SERVER_URL}/api/v1"
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${FUEL_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"Rockit ${TAG}\", \"body\": \"Release ${TAG}\"}" | jq -r '.id')
          curl -s -X POST \
            -H "Authorization: token ${FUEL_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@dist/${ARCHIVE}" \
            "${API}/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ARCHIVE}"
        env:
          FUEL_TOKEN: ${{ secrets.FUEL_TOKEN }}

      - name: Mirror to GitHub
        if: env.GH_PAT != ''
        run: |
          # Push code + tags
          git remote add github https://x-access-token:${GH_PAT}@github.com/dark-matter-tech/rockit-compiler.git
          git push github --all --force
          git push github --tags --force

          # Create matching GitHub release
          GH_RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/dark-matter-tech/rockit-compiler/releases" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"Rockit ${TAG}\", \"body\": \"Release ${TAG}\"}" | jq -r '.id')

          if [ -n "$GH_RELEASE_ID" ] && [ "$GH_RELEASE_ID" != "null" ]; then
            curl -s -X POST \
              -H "Authorization: token ${GH_PAT}" \
              -H "Content-Type: application/gzip" \
              --data-binary "@dist/${ARCHIVE}" \
              "https://uploads.github.com/repos/dark-matter-tech/rockit-compiler/releases/${GH_RELEASE_ID}/assets?name=${ARCHIVE}"
            echo "Mirrored release ${TAG} to GitHub"
          else
            echo "WARNING: Failed to create GitHub release"
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
