name: CI

on:
  push:
  pull_request:
    branches: [develop, beta, master, staging]

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    container: swift:5.10.1-jammy
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends git libssl-dev pkg-config
          if command -v clang > /dev/null 2>&1; then
            echo "clang already available: $(clang --version | head -1)"
          else
            apt-get install -y --no-install-recommends clang-15
            ln -sf /usr/bin/clang-15 /usr/bin/clang
          fi
          apt-get clean && rm -rf /var/lib/apt/lists/*

      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "machine ${GITHUB_SERVER_URL#https://} login x-access-token password ${GITHUB_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --recurse-submodules --branch "${BRANCH}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Clone Stage 0 (bootstrap compiler)
        run: |
          git clone --depth 1 https://github.com/dark-matter-tech/rockit-booster.git /tmp/stage0

      - name: Build Stage 0
        run: |
          cd /tmp/stage0
          swift build -c release

      - name: Build Stage 1 from source
        run: |
          ROCKIT=/tmp/stage0/.build/release/rockit
          bash src/build.sh
          $ROCKIT build-native src/command.rok

      - name: Build runtime
        run: bash runtime/rockit/build.sh

      - name: Run integration tests
        run: |
          STAGE1=src/command
          TRIPLE="x86_64-unknown-linux-gnu"
          PASS=0; FAIL=0; TOTAL=0
          for f in examples/test_*.rok; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .rok)
            TOTAL=$((TOTAL + 1))
            if $STAGE1 build-native "$f" -o "examples/$name" --runtime-path runtime/rockit_runtime.o --lib-path launchpad --target-triple $TRIPLE > /tmp/build_log 2>&1; then
              "examples/$name" > /dev/null 2>&1 || true
              PASS=$((PASS + 1))
            else
              echo "FAIL: $name"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Tests: $PASS/$TOTAL passed"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Bootstrap verification
        run: |
          TRIPLE="x86_64-unknown-linux-gnu"
          # Stage 1 -> Stage 2
          src/command build-native src/command.rok -o /tmp/stage2 --runtime-path runtime/rockit_runtime.o --target-triple $TRIPLE
          # Bytecode comparison
          src/command compile src/command.rok -o /tmp/stage2.rokb
          /tmp/stage2 compile src/command.rok -o /tmp/stage3.rokb
          if diff /tmp/stage2.rokb /tmp/stage3.rokb > /dev/null 2>&1; then
            echo "Bootstrap verified: Stage 2 == Stage 3"
          else
            echo "Bootstrap FAILED: bytecode mismatch"
            exit 1
          fi

  docker:
    name: Push Docker Image
    runs-on: ubuntu-22.04
    needs: [linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-15 libssl-dev pkg-config
          sudo ln -sf /usr/bin/clang-15 /usr/bin/clang

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10.1'

      - name: Clone Stage 0 (bootstrap compiler)
        run: git clone --depth 1 https://github.com/dark-matter-tech/rockit-booster.git /tmp/stage0

      - name: Build Stage 0
        run: cd /tmp/stage0 && swift build -c release

      - name: Build toolchain
        run: |
          ROCKIT=/tmp/stage0/.build/release/rockit
          bash src/build.sh
          $ROCKIT build-native src/command.rok
          bash runtime/rockit/build.sh
          mkdir -p rockit-toolchain/bin rockit-toolchain/share/rockit
          cp src/command rockit-toolchain/bin/rockit
          cp runtime/rockit_runtime.o rockit-toolchain/share/rockit/
          cp -r launchpad rockit-toolchain/share/rockit/stdlib
          chmod +x rockit-toolchain/bin/rockit

      - name: Determine Docker tag
        run: |
          case "${GITHUB_REF}" in
            refs/heads/beta)    echo "DOCKER_TAG=beta" >> "$GITHUB_ENV" ;;
            refs/heads/master)  echo "DOCKER_TAG=rc" >> "$GITHUB_ENV" ;;
            refs/heads/staging) echo "DOCKER_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      - name: Build Docker image
        run: docker build -f Dockerfile.toolchain -t ${{ secrets.DOCKERHUB_USERNAME }}/rockit-toolchain:${DOCKER_TAG} .

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rockit-toolchain:${DOCKER_TAG}

  macos:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone Stage 0 (bootstrap compiler)
        run: git clone --depth 1 https://github.com/dark-matter-tech/rockit-booster.git /tmp/stage0

      - name: Build Stage 0
        run: |
          cd /tmp/stage0
          swift build -c release

      - name: Build Stage 1
        run: |
          ROCKIT=/tmp/stage0/.build/release/rockit
          bash src/build.sh
          $ROCKIT build-native src/command.rok

      - name: Build runtime
        run: bash runtime/rockit/build.sh

      - name: Run integration tests
        run: |
          STAGE1=src/command
          PASS=0; FAIL=0; TOTAL=0
          for f in examples/test_*.rok; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .rok)
            TOTAL=$((TOTAL + 1))
            if $STAGE1 build-native "$f" -o "examples/$name" --runtime-path runtime/rockit_runtime.o --lib-path launchpad > /tmp/build_log 2>&1; then
              "examples/$name" > /dev/null 2>&1 || true
              PASS=$((PASS + 1))
            else
              echo "FAIL: $name"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Tests: $PASS/$TOTAL passed"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Bootstrap verification
        run: |
          src/command build-native src/command.rok -o /tmp/stage2 --runtime-path runtime/rockit_runtime.o
          src/command compile src/command.rok -o /tmp/stage2.rokb
          /tmp/stage2 compile src/command.rok -o /tmp/stage3.rokb
          if diff /tmp/stage2.rokb /tmp/stage3.rokb > /dev/null 2>&1; then
            echo "Bootstrap verified: Stage 2 == Stage 3"
          else
            echo "Bootstrap FAILED: bytecode mismatch"
            exit 1
          fi
